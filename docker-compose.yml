services:
  db:
    image: "${POSTGRES_IMAGE:-postgres:18-alpine}"
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-teamlunch}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-teamlunch}"
      POSTGRES_DB: "${POSTGRES_DB:-teamlunch}"
      PGDATA: "${POSTGRES_PGDATA:-/var/lib/postgresql/data/pgdata}"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./prisma/init-citext.sql:/docker-entrypoint-initdb.d/01-citext.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5

  # Dedicated, ephemeral Postgres used ONLY by the test suites (server
  # integration + e2e). Isolated from the dev/app `db` so tests never touch
  # real data. No named volume → data is discarded on `docker compose down`.
  db-test:
    image: postgres:18-alpine
    restart: "no"
    profiles: ["test"]
    ports:
      - "${TEST_DB_PORT:-55434}:5432"
    environment:
      POSTGRES_USER: teamlunch
      POSTGRES_PASSWORD: teamlunch
      POSTGRES_DB: teamlunch_test
      PGDATA: /var/lib/postgresql/data/pgdata
    # Durability off: every test commits its fixtures, and the WAL flush per
    # COMMIT was ~26% of server suite runtime. This database is thrown away on
    # `docker compose down` and rebuilt by `prisma migrate deploy`, so the only
    # thing at risk is data we would discard anyway. Never set this on `db`.
    # Measured: 147s -> 107s. Putting PGDATA on tmpfs as well changed nothing.
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    volumes:
      - ./prisma/init-citext.sql:/docker-entrypoint-initdb.d/01-citext.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamlunch -d teamlunch_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    image: team-lunch-migrate:latest
    build:
      context: .
      target: builder
      args:
        VITE_BASE_PATH: "${VITE_BASE_PATH:-/}"
    restart: "no"
    environment:
      DATABASE_URL: "${COMPOSE_DATABASE_URL:-postgresql://teamlunch:teamlunch@db:5432/teamlunch?schema=public}"
      NODE_ENV: production
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy

  app:
    image: team-lunch:latest
    build:
      context: .
      args:
        VITE_BASE_PATH: "${VITE_BASE_PATH:-/}"
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      DATABASE_URL: "${COMPOSE_DATABASE_URL:-postgresql://teamlunch:teamlunch@db:5432/teamlunch?schema=public}"
      NODE_ENV: production
      PORT: "${PORT:-3000}"
      BASE_PATH: "${BASE_PATH:-}"
      VITE_BASE_PATH: "${VITE_BASE_PATH:-}"
      APP_VERSION: "${APP_VERSION:-}"
      GIT_SHA: "${GIT_SHA:-}"
      GIT_BRANCH: "${GIT_BRANCH:-}"
      GIT_DIRTY: "${GIT_DIRTY:-}"
      BUILD_TIME: "${BUILD_TIME:-}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-}"
      AUTH_SESSION_SECRET: "${AUTH_SESSION_SECRET:-}"
      ENTRA_CLIENT_ID: "${ENTRA_CLIENT_ID:-}"
      ENTRA_CLIENT_SECRET: "${ENTRA_CLIENT_SECRET:-}"
      ENTRA_TENANT_ID: "${ENTRA_TENANT_ID:-}"
      ENTRA_REDIRECT_URI: "${ENTRA_REDIRECT_URI:-}"
      AUTH_ADMIN_EMAIL: "${AUTH_ADMIN_EMAIL:-}"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:

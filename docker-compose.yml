services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: teamlunch
      POSTGRES_PASSWORD: teamlunch
      POSTGRES_DB: teamlunch
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql
      - ./prisma/init-citext.sql:/docker-entrypoint-initdb.d/01-citext.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamlunch"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Dedicated, ephemeral Postgres used ONLY by the test suites (server
  # integration + e2e). Isolated from the dev/app `db` so tests never touch
  # real data. No named volume → data is discarded on `docker compose down`.
  db-test:
    image: postgres:18-alpine
    restart: "no"
    profiles: ["test"]
    ports:
      - "${TEST_DB_PORT:-55434}:5432"
    environment:
      POSTGRES_USER: teamlunch
      POSTGRES_PASSWORD: teamlunch
      POSTGRES_DB: teamlunch_test
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./prisma/init-citext.sql:/docker-entrypoint-initdb.d/01-citext.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamlunch -d teamlunch_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    image: team-lunch:latest
    restart: "no"
    environment:
      DATABASE_URL: "postgresql://teamlunch:teamlunch@db:5432/teamlunch?schema=public"
      NODE_ENV: production
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy

  app:
    image: team-lunch:latest
    build:
      context: .
      args:
        VITE_BASE_PATH: "${VITE_BASE_PATH:-/}"
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      DATABASE_URL: "postgresql://teamlunch:teamlunch@db:5432/teamlunch?schema=public"
      NODE_ENV: production
      PORT: "${PORT:-3000}"
      BASE_PATH: "${BASE_PATH:-}"
      VITE_BASE_PATH: "${VITE_BASE_PATH:-}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-}"
      AUTH_SESSION_SECRET: "${AUTH_SESSION_SECRET:-}"
      ENTRA_CLIENT_ID: "${ENTRA_CLIENT_ID:-}"
      ENTRA_CLIENT_SECRET: "${ENTRA_CLIENT_SECRET:-}"
      ENTRA_TENANT_ID: "${ENTRA_TENANT_ID:-}"
      ENTRA_REDIRECT_URI: "${ENTRA_REDIRECT_URI:-}"
      AUTH_ADMIN_EMAIL: "${AUTH_ADMIN_EMAIL:-}"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:

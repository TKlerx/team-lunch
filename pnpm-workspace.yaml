# Approve postinstall build scripts for native deps (engines/binaries).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true

# Dependency overrides (pnpm 11 reads these here, not from package.json).
overrides:
  source-map-js: 1.2.2
  'prisma>mysql2': 3.23.1
  '@prisma/config>deepmerge-ts': 8.0.1
  effect: 3.21.0
  '@hono/node-server': 2.0.10
  hono: 4.13.7
  'minimatch@3>brace-expansion': 1.1.21
  'minimatch@5>brace-expansion': 2.1.7
  'minimatch@10>brace-expansion': 5.0.12
  valibot: ^1.4.2
  '@fastify/ajv-compiler>fast-uri': 3.1.8
  'ajv>fast-uri': 3.1.8
  'fast-json-stringify>fast-uri': 4.1.5
  shell-quote: 1.10.0
  nanoid: 3.3.18
  '@vitest/mocker@>=2.1.0 <4.1.11': ^4.1.11
  baseline-browser-mapping@>=2.0.0 <2.11.0: ^2.11.0
  browserslist@<=4.28.6: ^4.28.7
  postcss-selector-parser@>=6.1.0 <6.1.3: ^6.1.3
  qs@>=2.2.5 <6.16.0: ^6.16.0
  qs@>=6.14.2 <=6.15.3: ^6.15.4
  vitest@>=2.1.0 <4.1.11: ^4.1.11

# Wait three days before resolving newly published packages.
minimumReleaseAge: 4320 # nosemgrep: package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age

# Security-patched releases deliberately exempt from the maturity delay.
minimumReleaseAgeExclude:
  - '@fastify/static'
  - '@hono/node-server'
  - brace-expansion
  - fastify
  - fast-uri
  - hono
  - mysql2
  - react-router
  - react-router-dom
  - postcss-selector-parser@6.1.3
  - browserslist@4.28.7
  - qs@6.15.4 || 6.16.0
  - vitest@4.1.11
  - '@vitest/mocker@4.1.11'
  - baseline-browser-mapping@2.11.0

# Production advisories are patched above; no audit exceptions.

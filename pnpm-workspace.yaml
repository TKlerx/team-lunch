# Approve postinstall build scripts for native deps (engines/binaries).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true

# Dependency overrides (pnpm 11 reads these here, not from package.json).
overrides:
  effect: 3.21.0
  '@hono/node-server': 2.0.10
  hono: 4.13.7
  'minimatch@3>brace-expansion': 1.1.21
  'minimatch@5>brace-expansion': 2.1.7
  'minimatch@10>brace-expansion': 5.0.12
  valibot: ^1.4.2
  '@fastify/ajv-compiler>fast-uri': 3.1.8
  'ajv>fast-uri': 3.1.8
  'fast-json-stringify>fast-uri': 4.1.5
  'prisma>mysql2': 3.23.1
  # Prisma uses deepmerge for plain config objects; v8's Map/API changes do not apply.
  '@prisma/config>deepmerge-ts': 8.0.0
  # ExcelJS uses the CommonJS v4 export retained in uuid 11.
  'exceljs>uuid': 11.1.1

# Wait seven days before resolving newly published packages.
minimumReleaseAge: 10080

# Security-patched release; intentionally exempt from the maturity delay.
minimumReleaseAgeExclude:
  - '@fastify/static'
  - '@hono/node-server'
  - brace-expansion
  - fastify
  - fast-uri
  - hono
  - mysql2
  - react-router
  - react-router-dom
  - uuid

# Production advisories are fixed through upgrades above; no audit exceptions.

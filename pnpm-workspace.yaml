# Approve postinstall build scripts for native deps (engines/binaries).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true

# Dependency overrides (pnpm 11 reads these here, not from package.json).
overrides:
  effect: 3.21.0
  '@hono/node-server': 2.0.10
  hono: 4.12.34
  'minimatch@3>brace-expansion': 1.1.18
  'minimatch@5>brace-expansion': 2.1.4
  'minimatch@10>brace-expansion': 5.0.9
  valibot: ^1.4.2
  '@fastify/ajv-compiler>fast-uri': 3.1.5
  'ajv>fast-uri': 3.1.5
  'fast-json-stringify>fast-uri': 4.1.2
  shell-quote: 1.10.0

# Wait seven days before resolving newly published packages.
minimumReleaseAge: 10080

# Security-patched release; intentionally exempt from the maturity delay.
minimumReleaseAgeExclude:
  - '@fastify/static'
  - '@hono/node-server'
  - brace-expansion
  - esbuild
  - fast-uri
  - form-data
  - hono
  - js-yaml
  - nanoid
  - postcss
  - shell-quote

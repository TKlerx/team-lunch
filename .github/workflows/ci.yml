name: Validate

on:
  pull_request:
  push:
    branches:
      - main

env:
  CI: "true"
  TEST_DB_PORT: "55434"
  TEST_DATABASE_SCHEMA: team_lunch_test
  TEST_DATABASE_URL: postgresql://teamlunch:teamlunch@127.0.0.1:55434/teamlunch_test?schema=team_lunch_test
  AUTH_SESSION_SECRET: ci-session-secret-12345678901234567890
  AUTH_ADMIN_EMAIL: ""
  AUTH_ADMIN_REMINDER_EMAILS: ""
  ENTRA_CLIENT_ID: ""
  ENTRA_CLIENT_SECRET: ""
  ENTRA_TENANT_ID: ""
  ENTRA_REDIRECT_URI: ""
  ENTRA_OPENID_CONFIGURATION_URL: ""
  APP_PUBLIC_URL: ""

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Semgrep
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install --upgrade semgrep

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start test database
        run: pnpm db:test:up

      - name: Run full merge validation
        run: bash ./validate.sh full

      - name: Stop test database
        if: always()
        run: pnpm db:test:down || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report
          path: reports/coverage
          if-no-files-found: ignore

      - name: Upload complexity report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: complexity-report
          path: reports/complexity
          if-no-files-found: ignore

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore

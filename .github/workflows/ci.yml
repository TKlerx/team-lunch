name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TEST_DB_PORT: "55434"
  TEST_DATABASE_SCHEMA: team_lunch_test
  TEST_DATABASE_URL: postgresql://teamlunch:teamlunch@127.0.0.1:55434/teamlunch_test?schema=team_lunch_test
  AUTH_SESSION_SECRET: ci-session-secret-12345678901234567890
  AUTH_ADMIN_EMAIL: ""
  AUTH_ADMIN_REMINDER_EMAILS: ""
  ENTRA_CLIENT_ID: ""
  ENTRA_CLIENT_SECRET: ""
  ENTRA_TENANT_ID: ""
  ENTRA_REDIRECT_URI: ""
  ENTRA_OPENID_CONFIGURATION_URL: ""
  APP_PUBLIC_URL: ""

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Semgrep
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install --requirement requirements-semgrep.txt

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start test database
        run: pnpm db:test:up

      - name: Run full merge validation
        run: bash ./validate.sh full

      - name: Stop test database
        if: always()
        run: pnpm db:test:down || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: reports/coverage
          if-no-files-found: ignore

      - name: Upload complexity report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: complexity-report
          path: reports/complexity
          if-no-files-found: ignore

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore
